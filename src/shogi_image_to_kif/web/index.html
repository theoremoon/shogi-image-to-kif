<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shogi · Image → KIF</title><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script></head>
<body>
<header><a class="brand" href="./">歩 <span>Shogi</span></a><span class="header-note">Image → KIF</span></header>
<main>
<div id="status" role="status" aria-live="polite"></div>
<div class="workspace">
<section class="panel source"><div class="panel-heading"><h2>Image</h2><button id="reset-image" class="quiet" hidden>Change</button></div>
<label class="dropzone" id="dropzone"><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff"><span class="upload-mark" aria-hidden="true">＋</span><strong>Drop / paste an image</strong><span>or click to choose</span><small>PNG · JPEG · WebP / 16 MB</small></label>
<div id="image-area" hidden><div class="canvas-wrap"><canvas id="source-canvas" tabindex="0" aria-label="原画像。範囲指定時は盤の左上と右下をクリック"></canvas></div><p id="image-name" class="caption"></p><div class="read-controls"><select id="orientation" aria-label="画像の盤の向き"><option value="sente_bottom">▲ 下</option><option value="gote_bottom">△ 下</option></select><button id="recognize" class="primary">Read →</button></div><details class="crop-options"><summary>Crop</summary><div class="row"><button id="select-bounds" class="secondary">Select</button><button id="auto-bounds" class="quiet">Auto</button></div><p id="bounds-status" class="hint">Auto</p></details></div>
<details class="tools"><summary>More</summary><label class="field">Samples<select id="sample-list" aria-label="サンプル画像"><option value="">Select…</option></select></label><p id="sample-credit" class="hint"></p><label class="field">Open JSON<input id="draft-file" type="file" accept=".json,application/json"></label><textarea id="sfen-input" rows="2" placeholder="SFEN" aria-label="SFEN"></textarea><button id="import-sfen" class="secondary">Open SFEN</button></details>
</section>
<section class="panel review"><div class="panel-heading"><h2>Position</h2><span id="review-count" class="badge" hidden></span></div>
<div id="review-placeholder" class="placeholder"><span aria-hidden="true">9 × 9</span><button id="blank-board" class="quiet">Start empty</button></div>
<div id="review-area" hidden>
<div class="edit-toolbar"><div class="palette-side" role="group" aria-label="置く駒の所属"><button id="side-b" class="selected" aria-label="先手" aria-pressed="true">▲</button><button id="side-w" aria-label="後手" aria-pressed="false">△</button></div><button id="undo" class="quiet" disabled title="修正を戻す">↶ Undo</button></div>
<div id="palette" class="palette" role="group" aria-label="置く駒の種類"></div>
<div class="board-wrap"><div class="files" aria-hidden="true"><span>9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div><div id="board" class="board" role="group" aria-label="将棋盤"></div><div class="ranks" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>七</span><span>八</span><span>九</span></div></div>
<p id="cell-detail" class="hint">駒を選んでマスをクリック</p>
<div class="hands"><fieldset><legend>▲ 持ち駒</legend><div id="hands-b" class="hand-inputs"></div></fieldset><fieldset><legend>△ 持ち駒</legend><div id="hands-w" class="hand-inputs"></div></fieldset></div>
<div class="review-controls"><select id="turn" aria-label="手番"><option value="">手番</option><option value="b">▲ 先手番</option><option value="w">△ 後手番</option></select><button id="save-draft" class="quiet">Save JSON</button></div>
<div class="export-controls"><button id="export" class="primary" disabled>Export →</button></div>
<details id="ocr-detail"><summary>OCR</summary><pre id="ocr-text"></pre></details>
</div></section>
</div>
<section id="output-area" class="panel output" hidden><div class="panel-heading"><h2>Text</h2><select id="output-format" aria-label="出力形式"><option value="kif">KIF</option><option value="bod">BOD</option><option value="sfen">SFEN</option></select></div><p id="output-warnings" class="hint"></p><textarea id="output-text" readonly rows="8" aria-label="局面テキスト"></textarea><div class="row"><button id="copy-output" class="primary">Copy</button><button id="download-output" class="secondary">Download</button><a href="https://www.studiok-i.net/ps/" target="_blank" rel="noreferrer" class="quiet">ぴよ将棋 ↗</a></div></section>
<footer>黄色 = 要確認</footer>
</main></body></html>
